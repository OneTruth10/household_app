name: Supabase Keep Alive

on:
  schedule:
    # 💡 毎日午前0時（UTC）に自動実行する設定
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能にする

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"